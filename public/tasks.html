<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Liste des Tâches</title>
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body id="page-top">
    <nav class="navbar navbar-expand-lg bg-secondary text-uppercase fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="index.html">Task</a>
            <button class="navbar-toggler text-uppercase fw-bold bg-primary text-white rounded" type="button"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Ouvrir le menu">Menu</button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="index.html">Accueil</a></li>
                    <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded active" aria-current="page" href="tasks.html">Tâches</a></li>
                    <li class="nav-item mx-0 mx-lg-1"><a class="nav-link py-3 px-0 px-lg-3 rounded" href="stats.html">Statistiques</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <header class="masthead bg-primary text-white text-center">
        <div class="container d-flex align-items-center flex-column">
            <h1 class="masthead-heading text-uppercase mb-0">Liste des tâches</h1>
        </div>
    </header>
    <section class="page-section" id="portfolio">
        <div class="container">
            <p id="greeting" class="greeting"></p>
            <form id="add-task-form" class="card form-card p-4 mb-5" novalidate>
                <h2 class="form-title h5 mb-3">Ajouter une tâche</h2>
                <div class="row g-2">
                    <div class="col-md-6">
                        <label class="visually-hidden" for="new-task">Nouvelle tâche</label>
                        <input type="text" id="new-task" class="form-control" placeholder="Nouvelle tâche" required>
                    </div>
                    <div class="col-md-4">
                        <label class="visually-hidden" for="new-tag">Tags</label>
                        <input type="text" id="new-tag" class="form-control" placeholder="Tags (séparés par une virgule)" required>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-primary">Ajouter</button>
                    </div>
                </div>
                <div id="form-message" class="app-message mt-3" role="status" aria-live="polite"></div>
            </form>
            <div class="row" id="tasks-container">
                <!-- Les tâches seront ajoutées ici dynamiquement -->
            </div>
        </div>
    </section>
    <div class="copyright py-4 text-center text-white">
        <div class="container"><small>Application Task · 2026</small></div>
    </div>
    <script src="js/commun.js"></script>
    <script src="js/tasks.js"></script>
</body>
</html>
